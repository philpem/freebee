# Sample TOML configuration file for freebee
#
# freebee searches first for ./.freebee.toml and then
# for $HOME/.freebee.toml. It reads the first one it
# finds and then stops.

[floppy]
	disk = "/path/to/floppy.img"	# Floppy disk is optional

[hard_disk]
	disk1 = "/path/to/hd.img"
	disk2 = "/path/to/hd2.img"	# Second disk is optional
	# Default disk parameters. Overridden by disk label in
	# the hard disk image.
	heads = 8
	sectors_per_track = 17

[display]
	x_scale = 1.0			# Scale in X dimension, 0 < n <= 45
	y_scale = 1.0			# Scale in Y dimension, 0 < n <= 45
	scale_quality = "linear"	# "nearest" (fastest), "linear" (default), or "best" (anisotropic)
	red = 0x00			# foreground colors
	green = 0xFF
	blue = 0x00

[roms]
	rom_14c = "/path/to/roms/14c.bin"	# Odd locations
	rom_15c = "/path/to/roms/15c.bin"	# Even locations

[serial]
	symlink = "serial-pty"

[vidpal]
	installed = true

[memory]
	base_memory = 2048		# Units of 1K bytes, 2048 is the max.
	extended_memory = 2048		# Units of 1K bytes, 2048 is the max.

[expansion]
	# The cards in the expansion slots, by slot (slot0 to slot7). Cards:
	# "ethernet", the AT&T 3B1 Ethernet board (see [network]).
	#slot1 = "ethernet"

[network]
	# The Ethernet board's station address
	mac = "02:00:00:3b:00:01"
	# The host side: "slirp" (user mode networking, NAT, as in QEMU) or
	# "none" (no cable). The 3B1 is 10.0.2.15, the host 10.0.2.2, DNS
	# 10.0.2.3.
	backend = "slirp"
	# Host ports that go to the 3B1, comma separated, as in QEMU:
	# [tcp:|udp:][hostaddr]:hostport-[guestaddr]:guestport
	hostfwd = "tcp:127.0.0.1:2323-:23"
	# libslirp's helpers for old protocols through NAT (they rewrite the
	# guest's FTP PORT commands, for the 3B1's ftp, which has no passive
	# mode). Off by default, as in QEMU.
	emu = false

[beeper]
	# Volume of the dialer's tone output, 0-100. This covers the system beep
	# (BEL) as well as DTMF dialling tones -- on real hardware they all come
	# from the same chip. 0 disables audio entirely.
	volume = 55
